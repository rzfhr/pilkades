<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Quick Count</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f4fa; min-height: 100vh; padding: 20px; }
  .container { max-width: 1000px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .header h1 { font-size: 1.3rem; color: #1e3c72; }
  .btn-logout { background: #e74c3c; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: .85rem; }
  .tab-nav { display: flex; gap: 5px; margin-bottom: 20px; background: #fff; padding: 5px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  .tab-nav button { flex: 1; padding: 12px; border: none; background: transparent; color: #666; font-weight: 600; cursor: pointer; border-radius: 8px; transition: .2s; }
  .tab-nav button.active { background: #2a5298; color: #fff; }
  .tab-content { display: none; } .tab-content.active { display: block; }
  .card { background: #fff; border-radius: 14px; padding: 22px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,.05); }
  .card h2 { font-size: 1.05rem; margin-bottom: 15px; color: #1e3c72; border-left: 4px solid #2a5298; padding-left: 10px; }
  label { font-size: .85rem; font-weight: 600; display: block; margin-bottom: 5px; color: #555; margin-top: 12px; }
  input, select { width: 100%; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: .95rem; }
  input:focus { outline: none; border-color: #2a5298; }
  .btn { padding: 12px 20px; border: none; border-radius: 8px; font-size: .95rem; font-weight: 600; cursor: pointer; }
  .btn-primary { background: #2a5298; color: #fff; } .btn-primary:hover { background: #1e3c72; }
  .btn-success { background: #27ae60; color: #fff; } .btn-success:hover { background: #1e8449; }
  .btn-danger { background: #e74c3c; color: #fff; } .btn-danger:hover { background: #c0392b; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .btn-group { display: flex; gap: 10px; margin-top: 15px; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: 10px; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
  th { background: #f0f4fa; color: #1e3c72; text-transform: uppercase; font-size: .75rem; }
  
  @media (max-width: 640px) {
    .grid-3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚙️ Panel Admin Quick Count</h1>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>

  <div class="tab-nav">
    <button class="active" data-tab="users" onclick="switchTab('users')">👥 Akun Petugas</button>
    <button data-tab="konfig" onclick="switchTab('konfig')">⚙️ Konfigurasi & Kandidat</button>
  </div>

  <!-- TAB USERS -->
  <div class="tab-content active" id="tab-users">
    <div class="card">
      <h2>Buat Akun Petugas TPS</h2>
      <div class="grid-3">
        <div>
          <label style="margin-top:0">Username</label>
          <input id="uName" placeholder="contoh: tps1">
        </div>
        <div>
          <label style="margin-top:0">Password</label>
          <input id="uPass" type="password" placeholder="Password">
        </div>
        <div>
          <label style="margin-top:0">Ditugaskan di TPS</label>
          <input id="uTps" type="number" min="1" placeholder="1">
        </div>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="buatUser()">➕ Buat Akun</button>
      </div>
    </div>
    
    <div class="card">
      <h2>Daftar Akun</h2>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Username</th><th>Role</th><th>Tugas TPS</th><th>Aksi</th></tr></thead>
          <tbody id="userList"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- TAMBAHKAN TOMBOL EXPORT DI SINI -->
    <div class="card" style="background: #eef4ff; border: 1px dashed #2a5298;">
      <h2>Export Data</h2>
      <p style="font-size: 0.85rem; color: #555; margin-bottom: 15px;">
        Unduh seluruh data rekapitulasi suara (termasuk suara tidak sah) dalam format CSV yang bisa dibuka di Excel.
      </p>
      <button class="btn btn-success" onclick="exportCSV()">📥 Download Data CSV</button>
    </div>

  <!-- TAB KONFIG -->
  <div class="tab-content" id="tab-konfig">
    <div class="card">
      <h2>Konfigurasi Desa & Kandidat</h2>
      <div class="grid-3">
        <div>
          <label style="margin-top:0">Nama Desa</label>
          <input id="namaDesa" placeholder="Desa Sukamaju">
        </div>
        <div>
          <label style="margin-top:0">Jumlah TPS</label>
          <input id="jumlahTps" type="number" min="1">
        </div>
        <div>
          <label style="margin-top:0">Jumlah Kandidat</label>
          <input id="jumlahKandidat" type="number" min="1" max="10" value="3">
        </div>
      </div>
      
      <div style="margin-top:15px">
        <button class="btn btn-primary" onclick="generateKandidat()">Buat Form Kandidat</button>
      </div>

      <div id="formKandidat" style="margin-top:20px; display:flex; flex-direction:column; gap:15px;"></div>
      
      <div class="btn-group">
        <button class="btn btn-success" onclick="simpanKonfigurasi()">💾 Simpan Konfigurasi</button>
      </div>
    </div>
  </div>
</div>

<script>
const socket = io();
let state = { desa:'', jumlahTps:0, kandidat:[], dataTps:[], users:{} };
let sesi = null;
const warnaDefault = ['#2a5298','#27ae60','#e67e22','#8e44ad','#e74c3c','#16a085','#d35400','#2c3e50','#c0392b','#7f8c8d'];

fetch('/api/session').then(r => r.json()).then(j => {
  if (!j.login || j.role !== 'admin') return location.href = '/login.html';
  sesi = j;
  renderUserList(); // Ambil list user saat pertama load
});

socket.on('state', s => { 
  state = s; 
  render(); 
});

function switchTab(name) {
  document.querySelectorAll('.tab-nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
}

function render() {
  if (document.activeElement.tagName !== 'INPUT') {
    document.getElementById('namaDesa').value = state.desa || '';
    document.getElementById('jumlahTps').value = state.jumlahTps || '';
    document.getElementById('jumlahKandidat').value = state.kandidat.length || 3;
  }
  if (document.getElementById('formKandidat').children.length === 0 && state.kandidat.length > 0) {
    generateKandidat();
  }
}

function generateKandidat() {
  const n = parseInt(document.getElementById('jumlahKandidat').value) || 1;
  const lama = state.kandidat || [];
  let html = '';
  
  for (let i = 0; i < n; i++) {
    const nama = lama[i]?.nama || 'Kandidat ' + (i + 1);
    const warna = lama[i]?.warna || warnaDefault[i % warnaDefault.length];
    const foto = lama[i]?.foto || '';
    
    html += `
      <div style="display:grid; grid-template-columns: 60px 1fr 120px; gap:10px; align-items:center; background:#f9f9f9; padding:10px; border-radius:8px;">
        <div style="text-align:center;">
          <img src="${foto || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'50\' height=\'50\'><circle cx=\'25\' cy=\'25\' r=\'25\' fill=\'#ddd\'/></svg>'}" id="preview_${i}" style="width:50px; height:50px; object-fit:cover; border-radius:50%; border:2px solid #ddd;">
        </div>
        <div>
          <label style="margin-top:0">Nama Kandidat ${i + 1}</label>
          <input class="input-nama-kandidat" data-idx="${i}" value="${nama}" placeholder="Nama Lengkap">
          <div style="display:flex; gap:10px; margin-top:5px;">
            <input type="file" id="file_${i}" accept="image/*" onchange="uploadFoto(this, ${i})" style="font-size:0.8rem">
          </div>
        </div>
        <div>
          <label style="margin-top:0">Warna</label>
          <input type="color" class="input-warna-kandidat" data-idx="${i}" value="${warna}" style="width:100%; height:40px; padding:2px; cursor:pointer;">
        </div>
      </div>
    `;
  }
  document.getElementById('formKandidat').innerHTML = html;
}

async function uploadFoto(input, idx) {
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = e.target.result;
    const ext = file.name.split('.').pop();
    
    document.getElementById('preview_' + idx).src = base64;
    
    const res = await fetch('/api/upload', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ image: base64, ext })
    });
    
    if (res.ok) {
      const j = await res.json();
      document.getElementById('preview_' + idx).dataset.fotoUrl = j.url;
    } else {
      alert('Gagal upload foto');
    }
  };
  reader.readAsDataURL(file);
}

async function simpanKonfigurasi() {
  const desa = document.getElementById('namaDesa').value;
  const jumlahTps = document.getElementById('jumlahTps').value;
  
  const kandidat = [];
  document.querySelectorAll('.input-nama-kandidat').forEach(inp => {
    const idx = parseInt(inp.dataset.idx);
    const preview = document.getElementById('preview_' + idx);
    kandidat[idx] = {
      nama: inp.value,
      warna: document.querySelector(`.input-warna-kandidat[data-idx="${idx}"]`).value,
      foto: preview.dataset.fotoUrl || (state.kandidat[idx]?.foto || '') 
    };
  });

  if (!kandidat.length) return alert('Buat form kandidat dulu!');
  
  const res = await fetch('/api/konfigurasi', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ desa, jumlahTps, kandidat })
  });
  
  if (res.ok) alert('Konfigurasi tersimpan!');
  else alert('Gagal menyimpan');
}

async function buatUser() {
  const username = document.getElementById('uName').value;
  const password = document.getElementById('uPass').value;
  const tpsNo = document.getElementById('uTps').value;
  if(!username || !password || !tpsNo) return alert('Lengkapi data');

  const res = await fetch('/api/users', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username, password, tpsNo })
  });
  
  if (res.ok) {
    alert('Akun berhasil dibuat');
    document.getElementById('uName').value = '';
    document.getElementById('uPass').value = '';
    document.getElementById('uTps').value = '';
    renderUserList(); // <-- Langsung refresh tabel
  } else {
    const j = await res.json();
    alert(j.error || 'Gagal');
  }
}

async function hapusUser(username) {
  if(!confirm('Hapus akun ' + username + '?')) return;
  await fetch('/api/users/' + username, { method: 'DELETE' });
  renderUserList(); // <-- Langsung refresh tabel
}

function renderUserList() {
  fetch('/api/users')
    .then(r => {
      if (!r.ok) throw new Error('Gagal load users');
      return r.json();
    })
    .then(users => {
      const tbody = document.getElementById('userList');
      if(!users || Object.keys(users).length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#999;padding:20px;">Belum ada akun</td></tr>';
        return;
      }
      tbody.innerHTML = Object.keys(users).map(u => {
        const user = users[u];
        return `
          <tr>
            <td><strong>${u}</strong></td>
            <td>${user.role === 'admin' ? 'Admin' : 'Petugas TPS'}</td>
            <td>${user.tpsNo ? 'TPS ' + user.tpsNo : '-'}</td>
            <td>${u !== 'admin' ? `<button class="btn btn-danger" style="padding:5px 10px;font-size:0.75rem" onclick="hapusUser('${u}')">Hapus</button>` : '-'}</td>
          </tr>
        `;
      }).join('');
    })
    .catch(err => {
      console.error(err);
      document.getElementById('userList').innerHTML = '<tr><td colspan="4" style="text-align:center;color:red;">Gagal memuat akun</td></tr>';
    });
}

function exportCSV() {
  // Pastikan data state sudah terisi
  if (!state.dataTps || state.dataTps.length === 0) {
    return alert('Belum ada data TPS yang masuk untuk diexport!');
  }

  let csv = 'TPS;DPT;';
  state.kandidat.forEach((k, i) => csv += `"${k.nama || 'Kandidat ' + (i+1)}";`);
  csv += 'Tidak Sah;Suara Sah\n';

  state.dataTps.forEach(t => {
    csv += `${t.no};${t.dpt};`;
    t.suara.forEach(s => csv += `${s};`);
    csv += `${t.tidakSah || 0};${t.suara.reduce((a,b)=>a+b,0)}\n`;
  });

  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'rekap_pilkades_' + (state.desa || 'desa') + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/login.html';
}
</script>
</body>
</html>
